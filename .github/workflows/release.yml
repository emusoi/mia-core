name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Notes from docs/changes.md
        # the section headed with this tag; a release without one stops here
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { on = ($2 == tag); next }
            on' docs/changes.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "docs/changes.md has no ## $GITHUB_REF_NAME section"; exit 1; }
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
